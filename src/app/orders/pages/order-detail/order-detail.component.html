<div class="order-detail" *ngIf="order() as order">
    <h2>Order #{{ order.id }}</h2>
  
    <div class="order-info">
      <p><strong>Customer:</strong> {{ order.customer }}</p>
      <p><strong>Date:</strong> {{ order.date }}</p>
      <p><strong>Payment:</strong> {{ order.payment }}</p>
      <p><strong>Total:</strong> ${{ order.total }}</p>
      <p><strong>Delivery:</strong> {{ order.delivery }}</p>
      <p><strong>Items:</strong> {{ order.items }}</p>
    </div>
  
    <form [formGroup]="editForm" (ngSubmit)="onSave()">
      <div class="form-group">
        <label>Fulfillment Status</label>
        <select formControlName="fulfillment">
          <option>Fulfilled</option>
          <option>Unfulfilled</option>
        </select>
      </div>
  
      <div class="form-group">
        <label>Notes</label>
        <textarea formControlName="notes" rows="4"></textarea>
      </div>
  
      <button type="submit">Save Changes</button>
    </form>
  </div>
